name: daily-digest

on:
  schedule:
    # GitHub cron is best-effort: runs at :00 are often hours late or dropped, so use
    # off-peak minutes plus two backups. A backup is skipped once today's issue exists.
    - cron: "23 3 * * *"       # 05:23/06:23 Kyiv (UTC+2/+3)
    - cron: "41 4 * * *"       # backup
    - cron: "13 6 * * *"       # backup
  workflow_dispatch:
    inputs:
      refresh_people:
        description: "Rebuild people base from Wikidata/Wikipedia"
        type: boolean
        default: false
      skip_if_built:
        description: "Do nothing if today's issue already exists (for external schedulers)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SKIP_IF_BUILT: ${{ github.event.inputs.skip_if_built }}
        run: |
          today=$(TZ=Europe/Kyiv date +%F)
          if { [ "$EVENT" = "schedule" ] || [ "$SKIP_IF_BUILT" = "true" ]; } && [ -f "data/digests/$today.json" ]; then
            echo "today's issue ($today) already built; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  digest:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_DATA_KEY: ${{ secrets.DATA_REPO_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch private graduate base
        if: env.HAS_DATA_KEY == 'true'
        continue-on-error: true   # without it the digest still runs on the public base
        uses: actions/checkout@v4
        with:
          repository: alexriabtsev/mohyla-monitor-data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: data/private
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Refresh people base (Mondays, on demand, or first run)
        continue-on-error: true   # an outage must not block the daily digest
        env:
          FORCE: ${{ github.event.inputs.refresh_people }}
        run: |
          if [ "$FORCE" = "true" ] || [ "$(date -u +%u)" = "1" ] || [ ! -f data/people.json ]; then
            python -m mohyla.cli people
          fi
      - name: Build daily digest
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python -m mohyla.cli daily
      - name: Commit data and site
        if: always()             # keep whatever was produced, even after a failed step
        run: |
          git config user.name "mohyla-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "chore: digest $(date -u +%F)"
          git push
